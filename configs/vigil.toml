# VIGIL v0.6 Configuration
# eBPF-based Endpoint Detection & Response

[global]
version = "0.5.0"

[modules]
# v0.1: Temporal anomaly detection (kprobe timing)
temporal_anomaly = true
# v0.3: Syscall argument filter (eBPF-PATROL)
syscall_arg_filter = true
# v0.4: Cross-view integrity (kernel vs userspace)
cross_view = true
# v0.5: Process lineage tracking
process_lineage = true
# v0.5a: BPF self-integrity watchdog
self_integrity = true
# v0.5b: Behavioral process clustering
behavioral_clustering = true
# v0.5c: DNS exfiltration detection
dns_exfiltration = true
# v0.5d: Container runtime detection
container_escape = true
# v0.5e: TTY input surveillance detection
tty_surveillance = true
# v0.5f: Network flow baseline
network_flow = true

[detection]
# Baseline learning duration
learn_duration = "30s"
# Detection interval (sliding window)
detection_interval = "5s"
# Sample rate for eBPF ringbuf
sample_rate = 100
# Consecutive hits required for CRITICAL alert
consecutive_hits = 3

[dashboard]
# Dashboard listen address
addr = ":8443"
# v0.7: TLS (set both paths to enable HTTPS; leave empty for plain HTTP)
# Generate a self-signed cert: openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=vigil"
tls_cert_file = ""
tls_key_file = ""

[alert]
# Maximum alert entries to keep in memory
max_entries = 1000

# ── Alert Routing (v0.6.0) ─────────────────────────────────────────────
# Fan alerts out to external destinations. All optional; empty = off.
# Each route has its own minimum level: webhook=warn (default), chat apps=critical.
[alert.routing]
# Generic webhook: POSTs the alert as JSON (works with custom receivers)
webhook_url = ""
webhook_min_level = "warn"
# Slack-compatible incoming webhook
slack_webhook_url = ""
slack_min_level = "critical"
# Discord webhook
discord_webhook_url = ""
discord_min_level = "critical"
# Telegram bot (token from @BotFather + chat ID from @userinfobot)
telegram_bot_token = ""
telegram_chat_id = ""
telegram_min_level = "critical"
# Structured event log (Suricata eve.json-style JSONL — tail-able by SIEMs)
jsonl_path = "/var/log/vigil/alerts.jsonl"
# HTTP timeout for external sends (seconds)
send_timeout_sec = 5

[syscall_arg_filter]
# Syscall argument filter configuration
# Allow known system processes to reduce noise
allow_systemd = true
allow_root = true

[baseline]
# How often to refresh the baseline
refresh_period = "2h"
# Blend factor: 50% old + fresh samples
blend_factor = 0.5

[lineage]
# Lineage rule engine interval
rule_interval = "30s"
# Process tree pruning interval
prune_interval = "5m"

[dns]
# DNS query rate threshold per process (queries/minute)
rate_threshold = 1000
# DNS response size threshold (bytes, above this = possible tunnel)
large_response_threshold = 4096

[tty]
# Rate threshold for TTY reads per process (reads/sec)
read_rate_threshold = 100

[flow]
# Connection rate threshold per process (connects/minute)
connect_rate_threshold = 100
# Unique destination threshold per process
unique_dest_threshold = 50

[container]
# Track container namespace transitions
track_namespaces = true

[integrity]
# BPF program verification interval
bpf_check_interval = "5m"
# Binary hash check interval
hash_check_interval = "30m"

[clustering]
# Behavioral clustering analysis interval
analysis_interval = "30s"
# Minimum risk score for clustering alerts
min_alert_score = 50